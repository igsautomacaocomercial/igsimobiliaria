services:
  postgres:
    image: postgres:16-alpine
    container_name: igs-imob-pro-postgres
    environment:
      POSTGRES_DB: igs_imob_pro
      POSTGRES_USER: igs
      POSTGRES_PASSWORD: igs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igs -d igs_imob_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
